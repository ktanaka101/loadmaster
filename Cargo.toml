[package]
name = "loadmaster"
version = "0.10.0"
edition = "2024"
rust-version = "1.88"
description = "Weighted job admission for parallel AI agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ktanaka101/loadmaster"
readme = "README.md"
keywords = ["queue", "semaphore", "agents", "cli", "concurrency"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
libc = "0.2.190"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.4.5", default-features = false }
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
